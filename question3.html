
<!DOCTYPE html>
<html>
<head>
    <title>Lab 4 - Question 3</title>
</head>
<body>

    <h2>JavaScript For Loop</h2>

    <p id="demo"></p>

    <script>
        let text = "";

        // Loop from 1 until 5
        for (let i = 1; i <= 5; i++) {
            text += "The number is " + i + "<br>";
        }

        // Display the result
        document.getElementById("demo").innerHTML = text;
    </script>

</body>
</html>
